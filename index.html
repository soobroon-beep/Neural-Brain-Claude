<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neural Brain">
<title>Neural Brain</title>
<link rel="manifest" id="lnkManifest" href="manifest.json">
<link rel="apple-touch-icon" id="lnkTouch" href="apple-touch-icon.png">
<link rel="icon" id="lnkFav" href="icon-96.png">
<script>/* icono elegido (Ajustes → Icono de la app): se aplica antes de pintar */
try{var _i=+localStorage.getItem('nb3_icon')||1;if(_i>1&&_i<=16){document.getElementById('lnkManifest').href='manifests/icon-'+_i+'.json';document.getElementById('lnkTouch').href='icons/app/i'+_i+'-180.png';document.getElementById('lnkFav').href='icons/app/i'+_i+'-96.png';}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060b;--text:#eef3fb;--muted:#8592a8;--dim:#5a6578;
  --glass:rgba(12,16,26,.56);--glass-2:rgba(20,26,40,.62);--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --blur:blur(22px) saturate(1.6);--blur-s:blur(12px) saturate(1.4);
  --accent:#6d8dff;--violet:#9a7bff;--green:#2bd4a4;--red:#ff6b81;--gold:#f2c46d;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --r:22px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
html{overscroll-behavior-y:none}
body{overflow-x:clip} /* clip (no hidden): hidden convertía al body en contenedor de scroll y, con overscroll-behavior, la página no se movía */
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
::selection{background:rgba(109,141,255,.35)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}

/* ── Fondo: aurora + red neuronal ── */
#sky{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
#sky i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform}
#sky .a{width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle,#2446c9 0,transparent 65%);animation:drift1 38s ease-in-out infinite alternate}
#sky .b{width:52vmax;height:52vmax;right:-20vmax;top:10vh;background:radial-gradient(circle,#5a2fc4 0,transparent 65%);opacity:.38;animation:drift2 46s ease-in-out infinite alternate}
#sky .c{width:46vmax;height:46vmax;left:20vw;bottom:-28vmax;background:radial-gradient(circle,#0d6f8c 0,transparent 65%);opacity:.3;animation:drift1 52s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-6vmax,8vmax) scale(.92)}}
#net{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55}

/* ── Cristal ── */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r)}

/* ── Estructura ── */
#app{min-height:100dvh;display:flex}
#side{display:none}
main{flex:1;min-width:0;padding:calc(18px + var(--safe-t)) 16px calc(120px + var(--safe-b));max-width:980px;margin:0 auto;width:100%}
.view{animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Dock flotante (celular) */
#dock{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:7px;border-radius:30px;background:rgba(10,14,22,.62);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:0 18px 50px -16px rgba(0,0,0,.8)}
#dock button{width:58px;height:50px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:600;transition:color .3s,background .35s var(--ease),transform .35s var(--spring)}
#dock button svg{width:21px;height:21px;transition:transform .4s var(--spring)}
#dock button.on{color:var(--text);background:rgba(255,255,255,.07)}
#dock button.on svg{transform:translateY(-1px) scale(1.08)}
#dock button:active{transform:scale(.9)}
#dock .plus{width:50px;height:50px;margin:0 6px;border-radius:50%;background:linear-gradient(140deg,#5f7dff,#8b6bff);color:#fff;box-shadow:0 8px 24px -6px rgba(109,120,255,.7)}
#dock .plus svg{width:24px;height:24px}

@media(min-width:980px){
  #dock{display:none}
  #side:empty{display:none}
  #side:not(:empty){display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;width:268px;flex:0 0 268px;padding:22px 14px;border-right:1px solid var(--line);background:rgba(8,11,18,.5);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
  main{padding:34px 40px 60px}
  .side-brand{display:flex;align-items:center;gap:12px;padding:4px 10px 18px}
  .side-brand b{font-size:15px;letter-spacing:.3px}.side-brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .side-nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;color:var(--muted);font-weight:600;font-size:13.5px;transition:background .3s,color .3s;text-align:left;width:100%}
  .side-nav svg{width:19px;height:19px;flex:0 0 19px}
  .side-nav:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .side-nav.on{background:rgba(255,255,255,.07);color:var(--text)}
  .side-sep{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--dim);padding:18px 12px 6px;text-transform:uppercase}
  .side-brain .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:0 0 9px;margin:0 5px}
  .side-new{margin-top:auto;justify-content:center;background:linear-gradient(140deg,#5f7dff,#8b6bff);color:#fff!important}
  .fab{display:none!important}
}

/* ── Cabeceras ── */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h1{font-size:24px;letter-spacing:-.6px;margin:0;line-height:1.15}
.top p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top .grow{flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text);background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s);transition:transform .3s var(--spring),background .3s;flex:0 0 42px}
.ib:active{transform:scale(.9)}.ib svg{width:20px;height:20px}
.eyebrow{font-size:10.5px;letter-spacing:1.4px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:26px 2px 12px}

/* ── Hero ── */
.hero{position:relative;padding:22px 20px;overflow:hidden;display:flex;align-items:center;gap:18px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.8px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.orb{position:relative;width:76px;height:76px;flex:0 0 76px}
.orb .core{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9c8ff,#6d8dff 40%,#5332c8 75%,#1b1240);box-shadow:0 0 40px -4px rgba(109,141,255,.7),inset 0 0 18px rgba(255,255,255,.25);animation:breathe 5s ease-in-out infinite}
.orb svg{position:absolute;inset:0;animation:spin 26s linear infinite}
.orb.sm{width:38px;height:38px;flex-basis:38px}.orb.sm .core{inset:7px}
.orb.xl{width:150px;height:150px;flex-basis:150px;margin:0 auto}.orb.xl .core{inset:28px}
@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 60px 2px rgba(109,141,255,.75),inset 0 0 18px rgba(255,255,255,.3)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Estado de conectores ── */
.conns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.conn{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:18px}
.conn .lg{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 34px;font-weight:800;font-size:13px}
.conn b{font-size:13px;display:block}.conn small{color:var(--muted);font-size:11px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn .pulse{width:7px;height:7px;border-radius:50%;background:var(--dim);margin-left:auto;flex:0 0 7px}
.conn .pulse.ok{background:var(--green);box-shadow:0 0 0 0 rgba(43,212,164,.6);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(43,212,164,0)}100%{box-shadow:0 0 0 0 rgba(43,212,164,0)}}
.lg-nh{background:linear-gradient(140deg,#ff9a5a,#e0507a);color:#fff}
.lg-vx{background:linear-gradient(140deg,#3d6cff,#8d5cff);color:#fff}
.lg-nb{background:linear-gradient(140deg,#6d8dff,#9a7bff);color:#fff}

/* ── Tarjetas de cerebro ── */
.brains{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bcard{position:relative;text-align:left;padding:18px;overflow:hidden;transition:transform .45s var(--spring),border-color .3s;min-height:168px;display:flex;flex-direction:column;gap:12px}
.bcard::before{content:'';position:absolute;width:180px;height:180px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.22;transition:opacity .4s,transform .6s var(--ease)}
.bcard:hover{border-color:var(--line-2)}.bcard:hover::before{opacity:.32;transform:scale(1.1)}
.bcard:active{transform:scale(.975)}
.bicon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.bicon svg{width:22px;height:22px}
.bcard h3{margin:0;font-size:17px;letter-spacing:-.3px}
.bcard .desc{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bstats{display:flex;gap:14px;margin-top:auto;font-size:12px;color:var(--muted)}
.bstats b{color:var(--text);font-size:15px;display:block;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);white-space:nowrap;transition:all .3s var(--ease)}
.chip svg{width:13px;height:13px}
.chip.on{color:var(--text);background:rgba(255,255,255,.1);border-color:var(--line-2)}
.chip.tiny{padding:3px 8px;font-size:10.5px}
.chip.c-nh{color:#ffb38a}.chip.c-vx{color:#9db4ff}
button.chip:active{transform:scale(.94)}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);border-style:dashed;min-height:168px}
.newcard svg{width:26px;height:26px}

/* ── Pestañas del cerebro ── */
.seg{position:relative;display:flex;gap:2px;padding:5px;border-radius:18px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;flex:1 0 auto;padding:10px 14px;border-radius:13px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:color .3s}
.seg button.on{color:var(--text)}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:7px}.seg button svg{width:17px;height:17px;flex:0 0 17px}
@media(max-width:560px){.seg button{flex:1 1 auto;padding:10px 12px}.seg button:not(.on) span{display:none}}
@media(min-width:561px){.seg button svg{display:none}}
.seg .pill{position:absolute;z-index:0;top:5px;bottom:5px;border-radius:13px;background:rgba(255,255,255,.09);transition:left .5s var(--spring),width .4s var(--ease)}

/* ── Enseñanzas ── */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:0 14px;height:44px;border-radius:15px}
.search svg{width:17px;height:17px;color:var(--muted);flex:0 0 17px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px}
.note{position:relative;padding:15px 16px 12px;border-radius:19px;display:flex;flex-direction:column;gap:9px;animation:viewIn .45s var(--ease) both}
.note.master{border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:linear-gradient(180deg,rgba(242,196,109,.07),var(--glass))}
.note .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);color:var(--muted)}
.kind.regla{color:#ff9db0;background:rgba(255,107,129,.1)}.kind.estrategia{color:#8fb0ff;background:rgba(109,141,255,.12)}.kind.trader{color:#c6a8ff;background:rgba(154,123,255,.12)}.kind.leccion{color:#7fe3c4;background:rgba(43,212,164,.1)}
.kind.mst{color:var(--gold);background:rgba(242,196,109,.12)}
.note .txt{font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.note.open .txt{-webkit-line-clamp:unset}
.note .foot{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:11px}
.note .foot .sp{flex:1}
.mini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:background .25s,color .25s}
.mini:hover{background:rgba(255,255,255,.06);color:var(--text)}.mini svg{width:16px;height:16px}
.mini.gold{color:var(--gold)}

/* ── Recuerdos ── */
.day{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:20px 4px 8px;display:flex;align-items:center;gap:10px}
.day::after{content:'';flex:1;height:1px;background:var(--line)}
.tl{border-radius:20px;overflow:hidden}
.ev{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left;transition:background .25s}
.ev:last-child{border-bottom:0}
.ev:hover{background:rgba(255,255,255,.025)}
.ev .lg{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 30px}
.ev .bd{flex:1;min-width:0}
.ev .what{font-size:12px;color:var(--muted)}.ev .what b{color:var(--text);font-weight:600}
.ev .ttl{font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .more{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap;line-height:1.5;display:none}
.ev.open .more{display:block}.ev.open .ttl{white-space:normal}
.ev time{font-size:11px;color:var(--dim);white-space:nowrap;margin-top:2px}

/* ── Aprendido ── */
.learn{padding:22px;position:relative;overflow:hidden}
.learn::before{content:'';position:absolute;inset:-40% -10% auto auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.12}
.md h3{font-size:15px;margin:18px 0 6px;letter-spacing:-.2px}.md h3:first-child{margin-top:0}
.md p{margin:7px 0;line-height:1.6;font-size:14px}.md ul{margin:6px 0;padding-left:18px}.md li{margin:5px 0;line-height:1.55;font-size:14px}
.md strong{color:#fff}.md code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:13px}
.lmeta svg{width:14px;height:14px;flex:0 0 14px}
.lmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:15px;padding:13px 14px;outline:0;font-size:14px;line-height:1.5;transition:border-color .25s,background .25s;resize:vertical}
.inp:focus{border-color:rgba(109,141,255,.55);background:rgba(255,255,255,.05)}
textarea.inp{min-height:110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:15px;font-weight:700;font-size:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:transform .3s var(--spring),background .3s,opacity .3s}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(140deg,#5f7dff,#8b6bff);border-color:transparent;color:#fff;box-shadow:0 10px 28px -10px rgba(109,120,255,.8)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ── Evolución ── */
.ggrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.glevel{display:flex;align-items:center;gap:16px;padding:16px 18px}
.lvwrap{position:relative;width:104px;height:104px;flex:0 0 104px}.lvwrap svg{position:absolute;inset:0}
.lvnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.lvnum b{font-size:30px;letter-spacing:-1px;line-height:1}.lvnum small{color:var(--muted);font-size:11px;margin-top:2px}
.lvtx b{display:block;font-size:15px}.lvtx small{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}
.lvbar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:10px;overflow:hidden}.lvbar i{display:block;height:100%;border-radius:6px;animation:grow 1.2s var(--ease) both}
@keyframes grow{from{width:0!important}}
.gtile{padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.gtile b{font-size:26px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.gtile small{color:var(--muted);font-size:12px}
.gti{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05);color:var(--c,var(--accent));margin-bottom:6px}.gti svg{width:16px;height:16px}
.netcard{padding:16px 16px 12px;margin-bottom:12px;overflow:hidden}
.nethead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.nethead b{font-size:15px;display:block}.nethead small{color:var(--muted);font-size:12px;display:block;margin-top:3px;line-height:1.45}
.netbox{position:relative;height:420px;margin:0 -16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(109,141,255,.05),transparent 70%)}
.netbox canvas{width:100%;height:100%;display:block;touch-action:manipulation}
.nettip{position:absolute;z-index:3;pointer-events:none;max-width:250px;padding:9px 12px;border-radius:13px;background:rgba(12,16,26,.88);-webkit-backdrop-filter:var(--blur-s);backdrop-filter:var(--blur-s);border:1px solid var(--line-2);font-size:12px;animation:viewIn .25s var(--ease)}
.nettip b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nettip span{color:var(--muted);font-size:11.5px}
.netleg{margin-top:12px}.dotc{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.chip.live{color:#7fe3c4}.chip.live i{width:6px;height:6px;border-radius:50%;background:#2bd4a4;animation:pulse 2s infinite}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.gcard{padding:16px}
.gsvg{width:100%;height:170px;display:block;overflow:visible}.gtx{fill:var(--dim);font-size:11px;font-family:Inter,sans-serif}
.gline{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.8s var(--ease) forwards}@keyframes draw{to{stroke-dashoffset:0}}

let T = null; // borrador de enseñanza

  const b = brain(); T = note ? {id: note.id, bid: b.id, kind: note.kind || 'nota', master: !!note.master, author: note.author || '', text: note.text || '', tags: (note.tags || []).join(', ')} : {bid: S.view === 'brain' || S.view === 'ask' ? b.id : (T && T.bid) || b.id, kind: 'nota', master: false, author: '', text: '', tags: ''};
  paintTeach();
}
function paintTeach() {
  const b = brain(T.bid);
  openSheet(`<h2>${T.id ? 'Editar enseñanza' : 'Enseñar algo'}</h2><div class="sub">Lo que le enseñas lo toma en cuenta al aprender y al responderte.</div>
    ${T.id ? '' : `<div class="lbl">A qué cerebro</div><div class="chips">${S.brains.map(x => `<button class="chip ${x.id === T.bid ? 'on' : ''}" data-tb="${x.id}" style="${x.id === T.bid ? 'border-color:' + x.color : ''}">${ic(x.icon)}${esc(x.name)}</button>`).join('')}</div>`}
    <div class="lbl">Qué es</div><div class="chips">${KIND.map(([k, t]) => `<button class="chip ${T.kind === k ? 'on' : ''}" data-tk="${k}">${t}</button>`).join('')}</div>
    <div class="field" ${T.kind === 'trader' ? '' : 'hidden'} id="authorF"><label for="tAuthor">Trader o fuente</label><input class="inp" id="tAuthor" maxlength="60" placeholder="Nombre del trader, canal o curso" value="${esc(T.author)}"></div>
    <div class="field"><label for="tText">${T.kind === 'trader' ? 'Su estrategia (puedes pegar la transcripción de un video)' : T.kind === 'regla' ? 'Tu regla' : T.kind === 'leccion' ? 'Qué aprendiste' : T.kind === 'estrategia' ? 'Tu estrategia' : 'Texto'}</label>
      <textarea class="inp" id="tText" rows="6" placeholder="${T.kind === 'regla' ? 'Ej.: No abro operación si el precio está debajo de la nube de Nova Nexus.' : T.kind === 'trader' ? 'Pega aquí lo que explica: entradas, salidas, stop, indicadores…' : T.kind === 'leccion' ? 'Ej.: Perdí en SOL por entrar antes del cierre de vela de 4h.' : 'Escribe o dicta…'}">${esc(T.text)}</textarea></div>
    <div class="row" style="margin-top:10px"><button class="chip" data-act="mic" data-target="tText">${ic('mic')}Dictar</button><button class="chip" data-act="distill" id="distillBtn" ${T.text.length > 400 ? '' : 'hidden'}>${ic('wand')}Resumir en reglas con IA</button></div>
    <div class="field"><label for="tTags">Etiquetas (opcional)</label><input class="inp" id="tTags" placeholder="btc, 4h, riesgo" value="${esc(T.tags)}"></div>
    <div class="glass list" style="margin-top:14px"><button class="set" data-act="tmaster"><span class="bd"><b>Regla maestra</b><small>Siempre la toma en cuenta${b.toVortex ? ' (también la IA de VORTEX)' : ''}, y te avisa si algo la rompe.</small></span><span class="toggle ${T.master ? 'on' : ''}"></span></button></div>
    <div class="row" style="margin-top:18px"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn pri" style="flex:1" data-act="saveNote">${ic('check', 2.2)}Guardar</button></div>`);
}
function readTeach() { if (!T || !$('#tText')) return; T.text = $('#tText').value; T.tags = $('#tTags').value; if ($('#tAuthor')) T.author = $('#tAuthor').value; }
async function saveNote() {
  readTeach(); const text = T.text.trim(); if (!text) { toast('Escribe algo primero'); return; }
  const now = Date.now(), id = T.id || uid(), ref = U().collection('brains').doc(T.bid).collection('notes').doc(String(id));
  const doc = {id: String(id), text, kind: T.kind, master: T.master, author: T.kind === 'trader' ? T.author.trim() : '', tags: T.tags.split(',').map(s => s.trim()).filter(Boolean).slice(0, 10), updatedAt: now};
  if (!T.id) Object.assign(doc, {createdAt: now, pinned: false});
  ref.set(doc, {merge: true}).catch(() => toast('No se pudo guardar; revisa tu conexión'));
  closeSheet(); toast(T.id ? 'Actualizado' : 'Aprendido. Lo tomará en cuenta'); T = null;
}
async function distill() {
  readTeach(); const btn = $('#distillBtn'); if (!btn) return; btn.disabled = true; btn.innerHTML = ic('wand') + 'Resumiendo…';
  try { const r = await L.chat(L.distillMessages(T.text, T.author), {maxTokens: 900, temperature: .3}); T.text = r.text; if (T.kind === 'nota') T.kind = 'estrategia'; paintTeach(); toast('Listo: revisa y guarda'); }
  catch { btn.disabled = false; btn.innerHTML = ic('wand') + 'Resumir en reglas con IA'; toast('La IA no respondió; inténtalo de nuevo'); }
}
function newBrainSheet() {
  T = {nb: true, icon: 'brain', color: COLORS[S.brains.length % COLORS.length]};
  openSheet(`<h2>Nuevo cerebro</h2><div class="sub">Cada cerebro aprende de lo que tú elijas y se entrena con sus propias enseñanzas.</div>
    <div class="field"><label for="nbName">Nombre</label><input class="inp" id="nbName" maxlength="40" placeholder="Ej.: Scalping, Clientes, Salud…"></div>
    <div class="field"><label for="nbDesc">De qué trata (opcional)</label><input class="inp" id="nbDesc" maxlength="140"></div>
    <div class="lbl">Aprende de</div><div class="chips"><button class="chip" data-nbs="novahub">Nova Hub</button><button class="chip" data-nbs="vortex">VORTEX</button></div>
    ${botsSeen().length ? `<div class="lbl">O hazlo el cerebro de un bot de Nova Bot Lab</div><div class="chips">${botsSeen().filter(x => !S.brains.some(q => isBot(q) && q.bot.id === x.id)).map(x => `<button class="chip" data-act="botBrain" data-bot="${esc(x.id)}" data-botname="${esc(x.name)}">${ic('bot')}${esc(x.name)}</button>`).join('') || '<span class="hint">Todos tus bots ya tienen cerebro.</span>'}</div><p class="hint">${ic('info')}El cerebro de un bot aprende de sus experimentos y lo mejora solo cada noche (siempre con tu aprobación).</p>` : ''}
    <div class="row" style="margin-top:20px"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn pri" style="flex:1" data-act="createBrain">${ic('plus', 2.2)}Crear</button></div>`);
}
async function createBrain() {
  const name = $('#nbName').value.trim(); if (!name) { toast('Ponle un nombre'); return; }
  const id = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24) + '-' + Date.now().toString(36).slice(-4);
  const sources = [...document.querySelectorAll('[data-nbs].on')].map(b => b.dataset.nbs);
  await saveBrain(id, {name, desc: $('#nbDesc').value.trim(), icon: T.icon, color: T.color, sources, toVortex: false, order: S.brains.length, createdAt: Date.now()});
  closeSheet(); go('brain', {brain: id, tab: 'graph'}); toast('Cerebro creado');
}

/* ═══════════ Aprender ═══════════ */
async function learnNow() {
  const b = brain(); if (S.busy) return; S.busy = true; render(true);
  try {
    const r = await L.chat(L.learnMessages(b, notesOf(b.id), eventsOf(b), firstName()), {maxTokens: 1500, timeout: 120000});
    await saveBrain(b.id, {learned: {text: r.text, at: Date.now(), by: 'app · ' + r.model, events: eventsOf(b).length, notes: notesOf(b.id).length}});
    toast(b.toVortex ? 'Aprendido. VORTEX lo recibe en la próxima sincronización' : 'Aprendido');
  } catch { toast('La IA gratuita no respondió; inténtalo en un momento'); }
  S.busy = false; render(true);
}

/* ═══════════ Dictado por voz ═══════════ */
let rec = null;
function stopMic() { if (rec) { try { rec.stop(); } catch {} rec = null; } document.querySelectorAll('.rec').forEach(x => x.classList.remove('rec')); }
function mic(btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) { toast('Tu navegador no permite dictar'); return; }
  if (rec) { stopMic(); return; }
  const el = $('#' + btn.dataset.target); if (!el) return; const base = el.value ? el.value.replace(/\s*$/, ' ') : '';
  rec = new SR(); rec.lang = 'es-MX'; rec.continuous = true; rec.interimResults = true; btn.classList.add('rec');
  rec.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; el.value = base + t; el.dispatchEvent(new Event('input', {bubbles: true})); };
  rec.onend = () => stopMic(); rec.onerror = () => stopMic(); rec.start();
}

/* ═══════════ Eventos ═══════════ */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-hub],[data-appicon],[data-go],[data-brain],[data-tab],[data-act],[data-kind],[data-app],[data-q],[data-askbrain],[data-tb],[data-tk],[data-icon],[data-color],[data-nbs]');
  if (!t) { if (e.target.id === 'back') closeSheet(); return; }
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.brain) return go('brain', {brain: d.brain, tab: S.view === 'brain' && S.cur !== d.brain ? S.tab : 'graph'});
  if (d.tab) { S.tab = d.tab; S.f.q = ''; S.f.kind = 'all'; S.f.app = 'all'; S.f.fam = ''; render(); return; }
  if (d.hub) { hubGo(d.hub); return; }
  if (d.appicon) { applyIcon(+d.appicon, true); toast('Icono «' + APP_ICONS[+d.appicon - 1] + '» listo'); render(true); return; }
  if (d.kind) { S.f.kind = d.kind; render(true); return; }
  if (d.app && !d.act) { S.f.app = d.app; render(true); return; }
  if (d.q) return ask(d.q);
  if (d.askbrain) { S.cur = d.askbrain; localStorage.setItem('nb3_cur', S.cur); render(); return; }
  if (d.tb) { readTeach(); T.bid = d.tb; paintTeach(); return; }
  if (d.tk) { readTeach(); T.kind = d.tk; paintTeach(); return; }
  if (d.nbs) { t.classList.toggle('on'); return; }
  if (d.icon) { saveBrain(S.cur, {icon: d.icon}); return; }
  if (d.color) { saveBrain(S.cur, {color: d.color}); return; }
  const note = t.closest('[data-note]'), nid = note && note.dataset.note, b = brain();
  switch (d.act) {
    case 'login': { // solo ventana emergente: la redirección pierde la sesión cuando la app vive en github.io y Firebase en otro dominio
      if (window.self !== window.top) { toast('Abre Neural Brain en una pestaña nueva para iniciar sesión'); break; }
      const pr = new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({prompt: 'select_account'});
      try { await firebase.auth().signInWithPopup(pr); }
      catch (er) { const c = er && er.code; toast(c === 'auth/popup-blocked' ? 'El navegador bloqueó la ventana: permite ventanas emergentes para este sitio' : c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' ? 'Inicio de sesión cancelado' : c === 'auth/unauthorized-domain' ? 'Este dominio no está autorizado en Firebase' : 'No se pudo iniciar sesión (' + (c || 'error') + ')'); }
      break; }
    case 'logout': if (confirm('¿Cerrar sesión en Neural Brain?')) { await firebase.auth().signOut(); } break;
    case 'teach': if (!S.user || !S.brains.length) return; teachSheet(); break;
    case 'closeSheet': closeSheet(); break;
    case 'saveNote': saveNote(); break;
    case 'distill': distill(); break;
    case 'tmaster': readTeach(); T.master = !T.master; t.querySelector('.toggle').classList.toggle('on', T.master); break;
    case 'mic': mic(t); break;
    case 'expand': note.classList.toggle('open'); S.open.has(nid) ? S.open.delete(nid) : S.open.add(nid); break;
    case 'master': { const n = notesOf(b.id).find(x => x.id === nid); if (n) U().collection('brains').doc(b.id).collection('notes').doc(nid).set({master: !n.master, updatedAt: Date.now()}, {merge: true}); break; }
    case 'editNote': { const n = notesOf(b.id).find(x => x.id === nid); if (n) teachSheet(n); break; }
    case 'delNote': if (confirm('¿Que este cerebro olvide esta enseñanza?')) U().collection('brains').doc(b.id).collection('notes').doc(nid).delete(); break;
    case 'expandEv': { const ev = t.closest('[data-ev]'), id = ev.dataset.ev; ev.classList.toggle('open'); S.open.has(id) ? S.open.delete(id) : S.open.add(id); break; }
    case 'forget': { const id = t.closest('[data-ev]').dataset.ev; if (confirm('¿Que tu cerebro olvide este recuerdo?')) U().collection('events').doc(id).delete(); break; }
    case 'moreEv': S.evLimit += 600; listenEvents(); toast('Cargando más recuerdos…'); break;
    case 'learn': learnNow(); break;
    case 'src': { const s = d.src, cur = new Set(b.sources || []); cur.has(s) ? cur.delete(s) : cur.add(s); saveBrain(b.id, {sources: [...cur]}); break; }
    case 'toVortex': saveBrain(b.id, {toVortex: !b.toVortex}); toast(!b.toVortex ? 'VORTEX lo recibe en la próxima sincronización (máx. 30 min)' : 'Ya no se le pasa a VORTEX'); break;
    case 'botAuto': saveBrain(b.id, {bot: Object.assign({}, b.bot, {auto: b.bot.auto === false})}); toast(b.bot.auto === false ? 'Lo mejorará cada noche' : 'Mejora automática en pausa'); break;
    case 'botUnlink': if (confirm('¿Desconectar el bot de este cerebro? Lo aprendido se conserva.')) saveBrain(b.id, {kind: 'normal', bot: null}); break;
    case 'autoLearn': saveBrain(b.id, {autoLearn: b.autoLearn === false}); break;
    case 'delBrain': if (confirm(`¿Borrar el cerebro «${b.name}» y todo lo que le enseñaste? Tus recuerdos de las apps no se borran.`)) { const ns = await U().collection('brains').doc(b.id).collection('notes').get(); const batch = db.batch(); ns.docs.forEach(x => batch.delete(x.ref)); batch.delete(U().collection('brains').doc(b.id)); await batch.commit(); go('home'); toast('Cerebro borrado'); } break;
    case 'newBrain': newBrainSheet(); break;
    case 'createBrain': createBrain(); break;
    case 'botBrain': { const id = 'bot-' + d.bot; await saveBrain(id, {name: 'Bot · ' + d.botname, kind: 'bot', bot: {id: d.bot, name: d.botname, auto: true}, icon: 'bot', color: '#9a7bff', desc: `Cerebro del bot «${d.botname}»: aprende de cada experimento y lo mejora solo cada noche.`, sources: ['vortex'], toVortex: false, autoLearn: true, order: S.brains.length, createdAt: Date.now()}); closeSheet(); go('brain', {brain: id, tab: 'graph'}); toast('Cerebro del bot creado: esta noche empieza a mejorarlo'); break; }
    case 'conn': { const a = d.app; U().collection('settings').doc('connections').set({[a]: S.conn[a] === false}, {merge: true}); break; }
    case 'clearChat': { if (!confirm('¿Borrar esta conversación?')) break; const bid = $('#chatLog').dataset.b, s = await U().collection('brains').doc(bid).collection('chatHistory').get(); const batch = db.batch(); s.docs.forEach(x => batch.delete(x.ref)); await batch.commit(); S.chats[bid] = []; paintChat(); break; }
    case 'export': exportAll(); break;
    case 'neuraOpen': if (window.Neura) Neura.open(); break;
    case 'neuraOn': if (window.Neura) { Neura.set({on: !Neura.cfg().on}); render(true); } break;
    case 'neuraTips': if (window.Neura) { Neura.set({tips: !Neura.cfg().tips}); render(true); } break;
    case 'clearFam': S.f.fam = ''; render(true); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'noteQ' || id === 'evQ') { S.f.q = e.target.value; clearTimeout(S.qT); S.qT = setTimeout(() => render(true), 160); }
  if (id === 'tText') { const btn = $('#distillBtn'); if (btn) btn.hidden = e.target.value.length < 400; }
  if (id === 'askIn') { e.target.style.height = 'auto'; e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px'; }
});
document.addEventListener('change', e => {
  const id = e.target.id, b = S.brains.find(x => x.id === S.cur); if (!b) return;
  if (id === 'instr') { saveBrain(b.id, {instructions: e.target.value.trim()}); toast('Guardado'); }
  if (id === 'bName' && e.target.value.trim()) saveBrain(b.id, {name: e.target.value.trim()});
  if (id === 'bDesc') saveBrain(b.id, {desc: e.target.value.trim()});
});
document.addEventListener('submit', e => { if (e.target.id === 'askForm') { e.preventDefault(); const i = $('#askIn'); const q = i.value; i.value = ''; i.style.height = 'auto'; stopMic(); ask(q); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
  if (e.target.id === 'askIn' && e.key === 'Enter' && !e.shiftKey && innerWidth > 720) { e.preventDefault(); $('#askForm').requestSubmit(); }
});
addEventListener('resize', () => { clearTimeout(S.rz); S.rz = setTimeout(() => { side(); const seg = $('.seg'); if (seg) movePill(seg); }, 120); });

async function exportAll() {
  const out = {exportado: new Date().toISOString(), cuenta: S.user.email, cerebros: S.brains.map(b => Object.assign({}, b, {enseñanzas: notesOf(b.id)})), recuerdos: S.events};
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type: 'application/json'})); a.download = 'neural-brain-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ═══════════ Red neuronal de fondo (ligera; se pausa si no se ve) ═══════════ */
(function net() {
  const c = $('#net'), x = c.getContext('2d'); let W, H, pts = [], raf = 0, last = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); const n = Math.round(Math.min(56, W * H / 26000)); pts = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18})); }
  function frame(t) {
    raf = requestAnimationFrame(frame); if (t - last < 33) return; last = t; x.clearRect(0, 0, W, H);
    for (const p of pts) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < 150) { x.strokeStyle = `rgba(130,150,255,${(1 - d / 150) * .16})`; x.lineWidth = 1; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); } }
    x.fillStyle = 'rgba(170,185,255,.5)'; for (const p of pts) { x.beginPath(); x.arc(p.x, p.y, 1.3, 0, 7); x.fill(); }
  }
  size(); addEventListener('resize', size);
  if (!reduce) { raf = requestAnimationFrame(frame); document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(frame); }); }
})();

/* ═══════════ Puente para Neura (neura.js) ═══════════ */
window.NB = {
  signedIn: () => !!S.user,
  md, toast,
  go(v, o) { if (v === 'brain') { o = o || {}; if (!o.brain) o.brain = S.cur; } go(v, o); },
  teach() { if (S.user && S.brains.length) teachSheet(); },
  learn() { learnNow(); },
  snapshot() {
    const G = window.BrainGraphs, TN = Object.fromEntries(TABS.map(t => [t[0], t[1]]));
    const where = S.view === 'brain' ? `cerebro «${(brain() || {}).name}» · pestaña ${TN[S.tab] || S.tab}` : ({home: 'Cerebros (inicio)', memories: 'Recuerdos', ask: 'Preguntar', settings: 'Ajustes'})[S.view] || S.view;
    const st = a => a === false ? 'pausado' : 'conectado';
    return {view: S.view, tab: S.tab, where, name: firstName(), conn: {novahub: st(S.conn.novahub) + (S.status.novahub ? ', última sincronización ' + ago(S.status.novahub.at) : ', sin sincronizar aún'), vortex: st(S.conn.vortex) + (S.status.vortex ? ', última sincronización ' + ago(S.status.vortex.at) : ', sin sincronizar aún')},
      brains: S.brains.map(b => { const n = notesOf(b.id), e = eventsOf(b), x = G.stats(n, e, b.learned), h = G.hubs(n, e); return {id: b.id, name: b.name, level: x.level, notes: n.length, masters: x.masters, events: e.length, week: x.week, sources: (b.sources || []).map(q => APP[q].n).join(' y '), toVortex: !!b.toVortex, learnedAgo: b.learned && b.learned.at ? ago(b.learned.at) : 'nunca', learned: b.learned && b.learned.text ? b.learned.text.replace(/\s+/g, ' ').slice(0, 450) : '', top: h.slice(0, 3).map(q => q.name + ' (' + q.items.length + ')').join(', ')}; })};
  }
};

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
boot();
