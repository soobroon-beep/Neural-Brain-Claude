name: Cerebro · aprendizaje nocturno
# Cada noche (3:20 a. m. de Ciudad de México) tus cerebros con recuerdos o enseñanzas nuevas actualizan «Lo que sé de ti».
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (la llave del proyecto de Firebase de Neural Brain).
on:
  schedule: [{cron: '20 9 * * *'}]
  workflow_dispatch:
    inputs:
      force: {description: 'Aprender aunque no haya novedades (1 = sí)', required: false, default: ''}
permissions:
  contents: read
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node scripts/learn.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event.inputs.force }}
