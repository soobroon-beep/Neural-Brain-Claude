name: Publicar reglas de Firestore
# Publica firestore.rules cuando cambia en main (o a mano). Usa el secreto FIREBASE_SERVICE_ACCOUNT.
on:
  push:
    branches: [main]
    paths: [firestore.rules, firebase.json, .github/workflows/deploy-firestore-rules.yml]
  workflow_dispatch: {}
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Sin llave, no se publica
        id: k
        run: if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; fi
      - name: Guardar credenciales temporales
        if: steps.k.outputs.skip != '1'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Publicar reglas
        if: steps.k.outputs.skip != '1'
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes --project neural-brain-148a4 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
